*{box-sizing:border-box;margin:0;padding:0;}
body{width:320px;height:50px;overflow:hidden;}
#mc{position:relative;width:320px;height:50px;overflow:hidden;border:1px solid #E0E0E0;background:#142B6F;}

/* Yellow icon logo — left, always visible */
#logo-wrap{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:32px;}

/* Cycling text zone */
#cycle-zone{position:absolute;left:52px;right:72px;top:0;bottom:0;overflow:hidden;}
.cycle-frame{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0;}
.main-text{position:absolute;left:0;top:50%;transform:translateY(-50%);font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:14px;font-weight:700;color:#FFFFFF;white-space:nowrap;}
#f4-sub{position:absolute;left:75px;top:20px;font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:8px;font-weight:700;color:#FFFFFF;white-space:nowrap;}

/* Ghost CTA — right, always visible */
#cta{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:'Inter',Arial,sans-serif;font-size:8px;font-weight:700;color:#F5D547;white-space:nowrap;border:1px solid #F5D547;padding:4px 8px;background:transparent;line-height:1;}

/* 4-frame cycling — 3s per frame, 12s total */
@keyframes cycle-frame {
  0%    { opacity: 0; }
  2.5%  { opacity: 1; }
  22.5% { opacity: 1; }
  25%   { opacity: 0; }
  100%  { opacity: 0; }
}

#f1 { animation: cycle-frame 12s infinite 0s   both; }
#f2 { animation: cycle-frame 12s infinite 3s   both; }
#f3 { animation: cycle-frame 12s infinite 6s   both; }
#f4 { animation: cycle-frame 12s infinite 9s   both; }
</style>
