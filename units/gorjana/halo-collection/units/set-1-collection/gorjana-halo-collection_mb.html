<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:320px;height:50px;overflow:hidden;background:#F9F9F9;font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased}

.mc-unit{
  position:relative;width:320px;height:50px;overflow:hidden;
  background:#F9F9F9;
  display:flex;align-items:center;padding:0 12px;
}

@keyframes gFadeIn{from{opacity:0}to{opacity:1}}
/* 2-frame cycle: each frame 3s visible, 0.5s transition */
@keyframes frame1Show{
  0%,55%{opacity:1}
  65%,100%{opacity:0}
}
@keyframes frame2Show{
  0%,55%{opacity:0}
  65%,100%{opacity:1}
}

/* Logo emblem */
.logo-zone{
  flex-shrink:0;width:24px;height:24px;margin-right:10px;
  opacity:0;animation:gFadeIn 0.6s ease-out 0.2s both;
}

/* Divider */
.divider{
  width:1px;height:20px;background:rgba(207,176,141,0.35);
  flex-shrink:0;margin-right:10px;
  opacity:0;animation:gFadeIn 0.5s ease-out 0.3s both;
}

/* Frame container */
.text-zone{flex-grow:1;position:relative;overflow:hidden;height:24px;}

.frame{
  position:absolute;top:0;left:0;right:0;
  font-family:'Jost',sans-serif;
  font-style:normal;font-size:13px;font-weight:300;
  color:#6f6f6f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:24px;
}
/* Frame 1 visible first, delay after initial load */
.frame-1{
  opacity:0;
  animation:gFadeIn 0.6s ease-out 0.5s forwards,
            frame1Show 7s linear 1.5s infinite;
}
.frame-2{
  opacity:0;
  animation:frame2Show 7s linear 1.5s infinite;
  font-family:'Playfair Display',Georgia,serif;font-style:normal!important;
  color:#6f6f6f;
}

/* CTA */
.cta{
  flex-shrink:0;margin-left:8px;
  font-family:'Playfair Display',Georgia,serif;font-size:10px;font-weight:400;
  color:#6f6f6f;letter-spacing:0.08em;padding-bottom:2px;
  border-bottom:1px solid rgba(111,111,111,0.55);
  cursor:pointer;white-space:nowrap;
  opacity:0;animation:gFadeIn 0.6s ease-out 0.8s both;
}

.click-overlay{position:absolute;inset:0;z-index:10;display:block;}
@media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important}}
</style>
</head>
