<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graza — Mayo Launch — 970×250 · Speculative, Marly Creative Concepts</title>
<meta name="description" content="Speculative work. Not affiliated with, commissioned by, or endorsed by Graza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:970px;height:250px;overflow:hidden;}

@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-in-bg{from{opacity:0}to{opacity:0.4}}
@keyframes slide-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes prod-in{from{opacity:0;transform:rotate(-4deg) translate(-12px,10px)}to{opacity:1;transform:rotate(-7.27deg) translate(0,0)}}
@keyframes clip-reveal{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0% 0 0)}}
@keyframes scale-fade{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}

.mc-unit{
  position:relative;width:970px;height:250px;
  background:#BFE512;
  overflow:hidden;cursor:pointer;
}

/* ── Background tile grid (12 tiles, 175×175px, blur 2.283px, opacity 0.06) ── */
.bt{
  position:absolute;
  width:175px;height:175px;
  filter:blur(2.283px);
  opacity:0;
  animation:fade-in-bg 0.8s ease-out 0s both;
}
.bt img{width:175px;height:175px;object-fit:cover;display:block;}

/* ── Atmospheric ellipses ── */
.orb{
  position:absolute;
  border-radius:50%;
  opacity:0;
  animation:fade-in 1.0s ease-out 0.3s both;
}

/* ── Hero product image (bleeds left) ── */
.product-outer{
  position:absolute;
  left:-61px;top:-18.77px;
  width:287.54px;height:287.54px;
  display:flex;align-items:center;justify-content:center;
  overflow:visible;
  z-index:20;
  opacity:0;
  animation:prod-in 0.7s cubic-bezier(0.25,0.46,0.45,0.94) 0.4s both;
}
.product-outer img{
  width:287.54px;height:287.54px;
  object-fit:contain;display:block;
  flex-shrink:0;
}

/* ── Wordmark ── */
.wordmark{
  position:absolute;
  left:206px;top:53px;
  width:65px;height:18px;
  z-index:10;
  opacity:0;
  animation:fade-in 0.4s ease-out 0.9s both;
}
.wordmark img{width:65px;height:18px;object-fit:contain;display:block;}

/* ── Headline ── */
.hl-main{
  position:absolute;
  left:206px;top:84px;
  font-family:'DM Serif Display',serif;
  font-size:40px;color:#000;
  line-height:1.05;white-space:nowrap;
  z-index:10;
  opacity:0;
  clip-path:inset(0 100% 0 0);
  animation:clip-reveal 0.6s ease-out 1.2s both;
}
.hl-sub{
  position:absolute;
  left:206px;top:136px;
  width:502px;
  font-family:'IBM Plex Mono',monospace;
  font-size:16px;color:#000;
  line-height:16px;white-space:nowrap;
  z-index:10;
  opacity:0;
  animation:fade-in 0.4s ease-out 1.8s both;
}

/* ── Mayo illustration (right side, large) ── */
.mayo-illust{
  position:absolute;
  left:719px;top:53px;
  width:251px;height:169px;
  z-index:10;
  opacity:0;
  animation:scale-fade 0.6s cubic-bezier(0.34,1.1,0.64,1) 2.0s both;
}
.mayo-illust img{width:251px;height:169px;object-fit:contain;display:block;}

/* ── Cream card (content container) ── */
.card{
  position:absolute;
  left:186px;top:28px;
  width:630px;height:171px;
  background:#F2E9D8;
  border-radius:4px 4px 0 0;
  z-index:5;
  opacity:0;
  animation:slide-up 0.4s cubic-bezier(0.34,1.1,0.64,1) 0.3s both;
}

/* ── CTA bar (rounded bottom, dark olive) ── */
.cta{
  position:absolute;
  left:186px;top:184px;
  width:630px;height:34px;
  background:#3C422E;
  border-radius:0 0 4px 4px;
  display:flex;align-items:center;
  padding:8px 20px;
  z-index:15;
  opacity:0;
  animation:slide-up 0.4s cubic-bezier(0.34,1.1,0.64,1) 2.4s both;
}
.cta span{
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;color:#fff;white-space:nowrap;
}
</style>
</head>
<body>
<div class="mc-unit" onclick="window.open('%%CLICK_URL_UNESC%%')">

  <!-- Background tile grid: 2 groups × 3 cols × 2 rows = 12 tiles -->
  <!-- Group 1 left half: cols -54, 139.26, 332.52 | rows top:-47, top:128 -->
  <div class="bt" style="left:-54px;top:-47px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:139.26px;top:-47px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:332.52px;top:-47px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:-54px;top:128px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:139.26px;top:128px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:332.52px;top:128px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <!-- Group 2 right half: cols 508, 701.26, 894.52 | rows top:-47, top:128 -->
  <div class="bt" style="left:508px;top:-47px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:701.26px;top:-47px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:894.52px;top:-47px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:508px;top:128px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:701.26px;top:128px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>
  <div class="bt" style="left:894.52px;top:128px;"><img src="/units/graza/assets/img-graza.webp" alt=""></div>

  <!-- Atmospheric ellipses -->
  <div class="orb" style="left:786px;top:58px;width:310px;height:310px;background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,transparent 65%);"></div>
  <div class="orb" style="left:333px;top:-124px;width:310px;height:310px;background:radial-gradient(circle,rgba(255,255,255,0.10) 0%,transparent 65%);"></div>

  <!-- Hero product image -->
  <div class="product-outer">
    <img src="/units/graza/assets/img-graza.webp" alt="Graza Mayo">
  </div>

  <!-- Wordmark -->
  <div class="wordmark">
    <img src="/units/graza/assets/logo-wordmark-graza.png" alt="Graza">
  </div>

  <!-- Headline -->
  <span class="hl-main">Mayo, but make it olive oil.</span>
  <span class="hl-sub">Made with 100% oil from olives. Richer and creamier.</span>

  <!-- Mayo illustration (large, right side) -->
  <div class="mayo-illust">
    <img src="/units/graza/assets/graza_orignal_mayo_illustration.svg" alt="">
  </div>

  <!-- Cream card strip -->
  <div class="card"></div>

  <!-- CTA bar -->
  <div class="cta">
    <span>Try Graza Mayo</span>
  </div>

</div>
</body>
</html>
