<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Spoon — Summer Sampler Drop — Set 1 — 300×600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{margin:0}
a{color:inherit;text-decoration:none}

.mc-unit{
  position:relative;
  width:300px;height:600px;
  overflow:hidden;
  background:#c0f0fd;
  cursor:pointer;display:block;
}

/* Decorative circles */
.c{position:absolute;border-radius:50%;pointer-events:none;z-index:1;}

/* Product image zone — large overhead shot, bleeds edges */
.product-img{
  position:absolute;
  left:-91px;top:-51px;
  width:490px;height:490px;
  z-index:2;
}
.product-img img{
  width:490px;height:490px;
  object-fit:cover;display:block;
  opacity:0;
  animation:fadeIn 0.6s ease 0.1s forwards;
}

/* Logo wrapper — top-left, above image */
.logo-wrap{
  position:absolute;
  left:24px;top:24px;
  width:72px;height:32px;
  z-index:5;
  opacity:0;
  animation:slideUp 0.5s ease 0.3s forwards;
}
.logo-wrap svg{display:block;overflow:visible;}

/* Headline */
.headline{
  position:absolute;
  left:24px;top:385px;width:251px;
  font-family:'Poppins',Arial,sans-serif;
  font-size:32px;font-weight:700;
  line-height:32px;
  color:#ff6b6b;
  z-index:3;
  opacity:0;
  animation:slideUp 0.5s ease 0.45s forwards;
}

/* Subhead */
.subhead{
  position:absolute;
  left:24px;top:453px;width:251px;
  font-family:'Poppins',Arial,sans-serif;
  font-size:14px;font-weight:600;
  color:#ff6b6b;
  opacity:0;
  animation:slideUp 0.4s ease 0.6s forwards;
}
.subhead-inner{opacity:0.80;}

/* Body */
.body-copy{
  position:absolute;
  left:24px;top:502px;width:260px;
  font-family:'Poppins',Arial,sans-serif;
  font-size:12px;font-weight:500;
  line-height:1.5;
  color:#ff6b6b;
  opacity:0;
  animation:slideUp 0.4s ease 0.7s forwards;
}
.body-copy-inner{opacity:0.82;}

/* CTA */
.cta-btn{
  position:absolute;
  left:184px;top:546px;
  width:97px;height:40px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;
  border-radius:100px;
  font-family:'Poppins',Arial,sans-serif;
  font-size:16px;font-weight:700;
  color:#1b1464;
  white-space:nowrap;
  z-index:4;
  opacity:0;
  animation:fadeIn 0.4s ease 0.85s forwards;
}

/* Border */
.boundary{position:absolute;inset:0;border:1px solid rgba(255,255,255,0.18);pointer-events:none;z-index:6;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;}
}
</style>
</head>
<body>

  <!-- Headline -->
  <div class="headline">CEREAL THAT DOESN'T SUCK</div>

  <!-- Subhead -->

<script>
(function(){
  if(typeof gsap==='undefined') return;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var circles=Array.from(document.querySelectorAll('.c'));
  var sorted=circles.slice().sort(function(a,b){return parseFloat(a.style.width)-parseFloat(b.style.width);});
  gsap.set(sorted,{scale:0,opacity:0,transformOrigin:'center center'});
  gsap.to(sorted,{
    scale:1,opacity:1,duration:0.5,ease:'back.out(1.7)',
    stagger:0.1,delay:0.2,
    onComplete:function(){
      sorted.forEach(function(el,i){
        var sz=parseFloat(el.style.width);
        var dy=sz<25?5:sz<50?4:3;
        var dx=sz<25?2:1;
        var dur=2.5+Math.random()*1.5;
        gsap.to(el,{y:dy,duration:dur,ease:'sine.inOut',repeat:-1,yoyo:true,delay:i*0.15});
        gsap.to(el,{x:dx,duration:dur*0.7,ease:'sine.inOut',repeat:-1,yoyo:true,delay:i*0.1});
      });
    }
  });
})();
</script>
