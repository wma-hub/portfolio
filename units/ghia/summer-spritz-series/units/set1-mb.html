<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=320,height=50">
<style>
@font-face{font-family:'FHACond';src:url('/units/ghia/assets/fonts/FHACondFrenchNC.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'NHD';src:url('/units/ghia/assets/fonts/NeueHaasDisplayRoman.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{width:320px;height:50px;overflow:hidden;background:#000;}
a{display:block;width:320px;height:50px;text-decoration:none;cursor:pointer;}
.ad{position:relative;width:320px;height:50px;overflow:hidden;background:#000;}
/* Frame layers */
.frame{position:absolute;inset:0;}
/* Shared headline style */
.hl{font-family:'FHACond',serif;font-size:24px;font-weight:400;color:#fff;position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;line-height:1;}
/* F1 — "All of the spirit." + product right */
.f1{animation:f1 7.5s ease forwards;}
.f1 .hl{left:12px;}
.f1 .img{position:absolute;left:197px;bottom:-34px;width:93px;height:84px;object-fit:cover;display:block;}
/* F2 — "None of the booze." + product left */
.f2{opacity:0;animation:f2 7.5s ease forwards;}
.f2 .hl{left:156px;}
.f2 .img{position:absolute;left:30px;bottom:4px;width:93px;height:84px;object-fit:cover;display:block;}
/* F3 — logo + subhead + CTA */
.f3{opacity:0;animation:f3 7.5s ease forwards;}
.f3-logo{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:48px;height:20px;}
.f3-logo img{width:48px;height:20px;object-fit:contain;filter:brightness(0) invert(1);display:block;}
.f3-sub{position:absolute;left:80px;top:19px;font-family:'NHD',sans-serif;font-size:10px;font-weight:400;color:#fff;white-space:nowrap;letter-spacing:0.02em;}
.f3-cta{position:absolute;left:238px;top:50%;transform:translateY(-50%);width:66px;height:18px;background:#6B2039;border-radius:2px;display:flex;align-items:center;justify-content:center;}
.f3-cta span{font-family:'NHD',sans-serif;font-size:8px;font-weight:400;color:#fff;white-space:nowrap;}
/* Keyframes — 7.5s total, plays once, locks on F3 (CTA frame).
   F1: visible 0–2.0s, fade out 2.0–2.5s
   F2: fade in 2.0–2.5s, visible 2.5–4.5s, fade out 4.5–5.0s
   F3: fade in 4.5–5.0s, visible 5.0–7.5s (holds as final state) */
@keyframes f1{
  0%     {opacity:1;}
  26.67% {opacity:1;}
  33.33% {opacity:0;}
  100%   {opacity:0;}
}
@keyframes f2{
  0%     {opacity:0;}
  26.67% {opacity:0;}
  33.33% {opacity:1;}
  60%    {opacity:1;}
  66.67% {opacity:0;}
  100%   {opacity:0;}
}
@keyframes f3{
  0%     {opacity:0;}
  60%    {opacity:0;}
  66.67% {opacity:1;}
  100%   {opacity:1;}
}
</style>
</head>
<body>
<a href="%%CLICK_URL_ESC%%" target="_blank" rel="noopener">
<div class="mc-unit">
  <!-- F1: All of the spirit. -->
  <div class="frame f1">
    <div class="hl">All of the spirit.</div>
    <img class="img" src="/units/ghia/assets/img/product-focus1.png" alt="" width="93" height="84">
  </div>
  <!-- F2: None of the booze. -->
  <div class="frame f2">
    <div class="hl">None of the booze.</div>
    <img class="img" src="/units/ghia/assets/img/product-focus1.png" alt="" width="93" height="84">
  </div>
  <!-- F3: Logo + subhead + CTA -->
  <div class="frame f3">
    <div class="f3-logo"><img src="/units/ghia/assets/logo-ghia.svg" alt="Ghia" width="48" height="20"></div>
    <div class="f3-sub">5 BOLD FLAVORS.&nbsp;&nbsp;0% ALCOHOL</div>
    <div class="f3-cta"><span>Shop Le Spritz</span></div>
  </div>
</div>
</a>
</body>
</html>
