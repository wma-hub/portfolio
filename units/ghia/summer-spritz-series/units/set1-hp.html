<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghia — Summer Spritz Series — 300×600 · Speculative, Marly Creative Concepts</title>
<meta name="description" content="Speculative work. Not affiliated with, commissioned by, or endorsed by Ghia.">
<meta name="ad.size" content="width=300,height=600">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'FHACond';src:url('/units/ghia/assets/fonts/FHACondFrenchNC.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'NHD';src:url('/units/ghia/assets/fonts/NeueHaasDisplayRoman.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{width:300px;height:600px;overflow:hidden;background:#000;}
a{display:block;width:300px;height:600px;text-decoration:none;cursor:pointer;}
.mc-unit{position:relative;width:300px;height:600px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px rgba(107,32,57,0.12);}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:38px;width:77px;height:32px;opacity:0;animation:fadeIn 0.7s cubic-bezier(.22,.61,.36,1) 0s forwards;}
.logo img{width:77px;height:32px;object-fit:contain;filter:brightness(0) invert(1);display:block;}
.content{position:absolute;left:15px;top:102px;width:270px;text-align:center;}
.headline{font-family:'FHACond',serif;font-size:32px;font-weight:400;color:#fff;line-height:1.1;clip-path:inset(0 100% 0 0);animation:clipLTR 0.8s cubic-bezier(.22,.61,.36,1) 0.5s forwards;}
.body-text{font-family:'Inter',sans-serif;font-size:14px;font-weight:400;color:#fff;margin-top:16px;line-height:1.5;opacity:0;animation:fadeIn 0.6s cubic-bezier(.22,.61,.36,1) 1.0s forwards;}
.body-sub{font-family:'NHD',sans-serif;font-size:9px;font-weight:400;color:#fff;margin-top:8px;line-height:12px;letter-spacing:0.04em;opacity:0;animation:fadeIn 0.5s cubic-bezier(.22,.61,.36,1) 1.3s forwards;}
.cta{position:absolute;left:97px;top:276px;width:106px;height:30px;background:#6B2039;border-radius:2px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.96);animation:ctaIn 0.6s cubic-bezier(.22,.61,.36,1) 1.5s forwards;}
.cta span{font-family:'NHD',sans-serif;font-size:12px;font-weight:400;color:#fff;white-space:nowrap;}
.product{position:absolute;left:0;bottom:0;width:300px;height:272px;opacity:0;transform:scale(0.96);transform-origin:bottom center;animation:settleIn 1.0s cubic-bezier(.22,.61,.36,1) 0.1s forwards;}
.product img{width:300px;height:272px;object-fit:cover;display:block;}
@keyframes fadeIn{to{opacity:1;}}
@keyframes clipLTR{to{clip-path:inset(0 0 0 0);}}
@keyframes settleIn{to{opacity:1;transform:scale(1);}}
@keyframes ctaIn{to{opacity:1;transform:scale(1);}}
</style>
</head>
<body>
<a href="%%CLICK_URL_ESC%%" target="_blank" rel="noopener">
<div class="mc-unit">
  <div class="logo"><img src="/units/ghia/assets/logo-ghia.svg" alt="Ghia" width="77" height="32"></div>
  <div class="content">
    <div class="headline">All of the spirit.<br>None of the booze.</div>
    <div class="body-text">Bright, bitter, and ready to drink.<br>Botanicals, not booze.</div>
    <div class="body-sub">5 BOLD FLAVORS<br>0% ALCOHOL</div>
  </div>
  <div class="cta"><span>Shop Le Spritz</span></div>
  <div class="product"><img src="/units/ghia/assets/img/product-focus1.png" alt="" width="300" height="272"></div>
</div>
</a>
</body>
</html>
