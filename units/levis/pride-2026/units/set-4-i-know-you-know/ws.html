<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=160,height=600">
  <title>Levi's Pride 2026 — I Know You Know — 160×600 · Speculative, Marly Creative Concepts</title>
<meta name="description" content="Speculative work. Not affiliated with, commissioned by, or endorsed by Levi's.">
  <style>
    @font-face{font-family:'Anton';src:url('/units/levis/assets/fonts/Anton-Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-SemiBold.woff2')format('woff2');font-weight:600;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Medium.woff2')format('woff2');font-weight:500;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Black.woff2')format('woff2');font-weight:900;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Bold.woff2')format('woff2');font-weight:700;font-display:swap;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{width:160px;height:600px;overflow:hidden;cursor:pointer;}
    .mc-unit{position:relative;width:160px;height:600px;background:#232323;overflow:hidden;border:1px solid #444;}
    #f1,#f2,#cta{position:absolute;left:0;top:0;width:160px;height:600px;pointer-events:none;z-index:5;}
  </style>
</head>
<body>
  <div class="mc-unit">
    <!-- img-zone: flat, partial-top (y=126, leaving 126px solid band at top) — persistent -->
    <div style="position:absolute;left:-212px;top:126px;width:567px;height:474px;z-index:1;">
      <img src="/units/levis/assets/images/pride-4.webp" alt="" style="position:absolute;inset:0;max-width:none;object-fit:cover;pointer-events:none;width:100%;height:100%;">
    </div>

    <!-- Ellipse 1 (top-left, persistent) -->
    <div style="position:absolute;display:flex;align-items:center;justify-content:center;left:-217px;top:-235px;width:451.875px;height:445.258px;z-index:2;">
      <div style="flex:none;transform:rotate(47.55deg);">
        <div style="position:relative;width:265px;height:370px;">
          <div style="position:absolute;inset:-33.78% -47.17%;">
            <div style="display:block;max-width:none;width:100%;height:100%;background:radial-gradient(ellipse at center, rgba(39,39,39,0.75) 0%, rgba(39,39,39,0.35) 45%, transparent 75%);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ellipse 2 (bottom, persistent) -->
    <div style="position:absolute;display:flex;align-items:center;justify-content:center;left:-104px;top:350px;width:439.206px;height:431.406px;z-index:2;">
      <div style="flex:none;transform:rotate(47.55deg);">
        <div style="position:relative;width:246.227px;height:370px;">
          <div style="position:absolute;inset:-33.78% -50.77%;">
            <div style="display:block;max-width:none;width:100%;height:100%;background:radial-gradient(ellipse at center, rgba(39,39,39,0.75) 0%, rgba(39,39,39,0.35) 45%, transparent 75%);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Logo (persistent, centered) -->
    <img src="/units/levis/assets/images/logo.png" alt="Levi's" style="position:absolute;transform:translateX(-50%);left:50%;top:41px;width:88px;height:36px;z-index:10;object-fit:contain;">
    <p style="position:absolute;transform:translateX(-50%);left:calc(50% + 0.5px);top:441px;width:141px;font-family:'Inter',sans-serif;font-weight:600;font-size:10px;line-height:normal;color:#fff;text-align:center;z-index:10;"><span style="font-weight:900">PRIDE</span> <span style="font-weight:500">2026</span></p>

    <!-- F1: I know you know. -->
    <div id="f1">
      <div style="position:absolute;transform:translateX(-50%);left:calc(50% + 0.5px);top:457px;width:141px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;color:#fff;z-index:6;">
        <div style="font-family:'Anton',sans-serif;font-weight:400;font-size:32px;line-height:0;white-space:nowrap;">
          <p style="line-height:38px;margin-bottom:0;">I know</p>
          <p style="line-height:38px;">you know.</p>
        </div>
      </div>
    </div>

    <!-- F2: For those who recognize each other. -->
    <div id="f2">
      <div style="position:absolute;transform:translateX(-50%);left:calc(50% + 0.5px);top:457px;width:141px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;color:#fff;z-index:6;">
        <div style="font-family:'Anton',sans-serif;font-weight:400;font-size:22px;line-height:0;width:129px;">
          <p style="line-height:32px;margin-bottom:0;">For those who</p>
          <p style="line-height:32px;">recognize each other.</p>
        </div>
      </div>
    </div>

    <!-- CTA (F3) -->
    <div id="cta">
      <div style="position:absolute;transform:translateX(-50%);left:calc(50% - 0.5px);top:496px;width:113px;background:#c8102e;display:flex;align-items:center;justify-content:center;padding:8px 16px;z-index:6;">
        <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:13px;text-align:center;color:#fff;line-height:0;white-space:nowrap;">
          <p style="line-height:normal;margin-bottom:0;">Shop the</p>
          <p style="line-height:normal;">Collection</p>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.clickTag="https://www.levi.com/US/en_US/lgbt-pride-collection/c/levi_clothing_pride_us";
    document.addEventListener('click',function(){window.open(window.clickTag,'_blank');});
    gsap.set(['#f1','#f2','#cta'],{autoAlpha:0});
    const tl=gsap.timeline({repeat:-1,onRepeat:function(){gsap.set(['#f1','#f2','#cta'],{autoAlpha:0});}});
    tl.to('#f1',{autoAlpha:1,duration:0.4})
      .to('#f1',{autoAlpha:0,duration:0.4},'+=2.5')
      .to('#f2',{autoAlpha:1,duration:0.4})
      .to('#f2',{autoAlpha:0,duration:0.4},'+=2.5')
      .to('#cta',{autoAlpha:1,duration:0.4})
      .to('#cta',{autoAlpha:0,duration:0.4},'+=2.5');
  </script>
</body>
</html>
