<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=728,height=90">
  <title>Levi's Pride 2026 — I Know You Know — 728×90</title>
  <style>
    @font-face{font-family:'Anton';src:url('/units/levis/assets/fonts/Anton-Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-SemiBold.woff2')format('woff2');font-weight:600;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Bold.woff2')format('woff2');font-weight:700;font-display:swap;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{width:728px;height:90px;overflow:hidden;cursor:pointer;}
    .ad{position:relative;width:728px;height:90px;background:#232323;overflow:hidden;border:1px solid #444;}
  </style>
</head>
<body>
  <div class="mc-unit">
    <!-- img-zone: two-level -->
    <div id="img-zone" style="position:absolute;left:0;top:-29px;width:226px;height:189px;z-index:1;">
      <div style="position:absolute;inset:0;overflow:hidden;">
        <img src="/units/levis/assets/images/pride-4.webp" alt="" style="position:absolute;height:172.51%;left:-15.49%;top:-32.83%;width:115.49%;max-width:none;pointer-events:none;">
      </div>
    </div>

    <!-- Logo -->
    <img id="logo" src="/units/levis/assets/images/logo.png" alt="Levi's" style="position:absolute;left:252px;top:calc(50% - 0.5px);transform:translateY(-50%);width:71px;height:29px;z-index:10;object-fit:contain;">

    <!-- Headline (locked copy override: "I know you know.") -->
    <div id="headline" style="position:absolute;left:349px;top:calc(50% - 0.5px);transform:translateY(-50%);font-family:'Anton',sans-serif;font-weight:400;font-size:22px;color:#fff;line-height:0;display:flex;flex-direction:column;justify-content:center;white-space:nowrap;z-index:10;">
      <p style="line-height:normal;">I know you know.</p>
    </div>

    <!-- CTA -->
    <div id="cta-wrap" style="position:absolute;left:548px;top:50%;transform:translateY(-50%);background:#c8102e;padding:8px 16px;border-radius:4px;z-index:10;display:flex;align-items:center;justify-content:center;">
      <p style="font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:#fff;white-space:nowrap;line-height:normal;">Shop the Collection</p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.clickTag="https://www.levi.com/US/en_US/lgbt-pride-collection/c/levi_clothing_pride_us";
    document.addEventListener('click',function(){window.open(window.clickTag,'_blank');});
    gsap.set(['#img-zone','#logo','#headline','#cta-wrap'],{autoAlpha:0});
    const tl=gsap.timeline();
    tl.to('#img-zone',{autoAlpha:1,duration:0.5})
      .to('#logo',{autoAlpha:1,duration:0.4},'+=0.1')
      .to('#headline',{autoAlpha:1,duration:0.4},'+=0.1')
      .to('#cta-wrap',{autoAlpha:1,duration:0.4},'+=0.1');
  </script>
</body>
</html>
