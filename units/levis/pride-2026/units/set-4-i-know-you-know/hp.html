<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=600">
  <title>Levi's Pride 2026 — I Know You Know — 300×600 · Speculative, Marly Creative Concepts</title>
<meta name="description" content="Speculative work. Not affiliated with, commissioned by, or endorsed by Levi's.">
  <style>
    @font-face{font-family:'Anton';src:url('/units/levis/assets/fonts/Anton-Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Regular.woff2')format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-SemiBold.woff2')format('woff2');font-weight:600;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Medium.woff2')format('woff2');font-weight:500;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Black.woff2')format('woff2');font-weight:900;font-display:swap;}
    @font-face{font-family:'Inter';src:url('/units/levis/assets/fonts/Inter-Bold.woff2')format('woff2');font-weight:700;font-display:swap;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{width:300px;height:600px;overflow:hidden;cursor:pointer;}
    .mc-unit{position:relative;width:300px;height:600px;background:#232323;overflow:hidden;border:1px solid #444;}
    #f1,#f2,#cta{position:absolute;left:0;top:0;width:300px;height:600px;pointer-events:none;z-index:5;}
  </style>
</head>
<body>
  <div class="mc-unit">
    <!-- img-zone: flat (persistent) -->
    <div style="position:absolute;left:-189px;top:-1px;width:719px;height:601px;z-index:1;">
      <img src="/units/levis/assets/images/pride-4.webp" alt="" style="position:absolute;inset:0;max-width:none;object-fit:cover;pointer-events:none;width:100%;height:100%;">
    </div>

    <!-- Ellipse 2 (lower, persistent) -->
    <div style="position:absolute;display:flex;align-items:center;justify-content:center;left:-134px;top:342px;width:443.543px;height:398.239px;z-index:2;">
      <div style="flex:none;transform:rotate(120deg);">
        <div style="position:relative;width:246.227px;height:370px;">
          <div style="position:absolute;inset:-33.78% -50.77%;">
            <div style="display:block;max-width:none;width:100%;height:100%;background:radial-gradient(ellipse at center, rgba(39,39,39,0.75) 0%, rgba(39,39,39,0.35) 45%, transparent 75%);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ellipse 3 (upper, persistent) -->
    <div style="position:absolute;display:flex;align-items:center;justify-content:center;left:-177px;top:-180px;width:444.16px;height:403.609px;z-index:2;">
      <div style="flex:none;transform:rotate(58.4deg);">
        <div style="position:relative;width:246.227px;height:370px;">
          <div style="position:absolute;inset:-33.78% -50.77%;">
            <div style="display:block;max-width:none;width:100%;height:100%;background:radial-gradient(ellipse at center, rgba(39,39,39,0.75) 0%, rgba(39,39,39,0.35) 45%, transparent 75%);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Logo (persistent, left-shifted center) -->
    <img src="/units/levis/assets/images/logo.png" alt="Levi's" style="position:absolute;transform:translateX(-50%);left:calc(50% - 76px);top:30px;width:88px;height:36px;z-index:10;object-fit:contain;">
    <p style="position:absolute;transform:translateX(-50%);left:calc(50% - 22.5px);top:414px;width:195px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.83px;line-height:normal;color:#fff;z-index:10;"><span style="font-weight:900">PRIDE</span> <span style="font-weight:500">2026</span></p>

    <!-- F1: I know you know. -->
    <div id="f1">
      <div style="position:absolute;transform:translateX(-50%);left:calc(50% - 22.5px);top:437px;width:195px;display:flex;flex-direction:column;gap:5.532px;align-items:flex-start;color:#fff;">
        <div style="font-family:'Anton',sans-serif;font-weight:400;font-size:44.255px;line-height:0;white-space:nowrap;">
          <p style="line-height:49.787px;margin-bottom:0;">I know</p>
          <p style="line-height:49.787px;">you know.</p>
        </div>
      </div>
    </div>

    <!-- F2: For those who recognize each other. -->
    <div id="f2">
      <div style="position:absolute;transform:translateX(-50%);left:calc(50% - 22.5px);top:437px;width:195px;display:flex;flex-direction:column;gap:5.532px;align-items:flex-start;color:#fff;">
        <div style="font-family:'Anton',sans-serif;font-weight:400;font-size:32px;line-height:0;width:100%;">
          <p style="line-height:40px;margin-bottom:0;">For those who</p>
          <p style="line-height:40px;">recognize each other.</p>
        </div>
      </div>
    </div>

    <!-- CTA (F3) -->
    <div id="cta">
      <div style="position:absolute;left:35px;top:487px;background:#c8102e;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:4px;">
        <p style="font-family:'Inter',sans-serif;font-weight:700;font-size:20px;text-align:center;color:#fff;white-space:nowrap;line-height:normal;">Shop the Collection</p>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.clickTag="https://www.levi.com/US/en_US/lgbt-pride-collection/c/levi_clothing_pride_us";
    document.addEventListener('click',function(){window.open(window.clickTag,'_blank');});
    gsap.set(['#f1','#f2','#cta'],{autoAlpha:0});
    const tl=gsap.timeline({repeat:-1,onRepeat:function(){gsap.set(['#f1','#f2','#cta'],{autoAlpha:0});}});
    tl.to('#f1',{autoAlpha:1,duration:0.4})
      .to('#f1',{autoAlpha:0,duration:0.4},'+=2.5')
      .to('#f2',{autoAlpha:1,duration:0.4})
      .to('#f2',{autoAlpha:0,duration:0.4},'+=2.5')
      .to('#cta',{autoAlpha:1,duration:0.4})
      .to('#cta',{autoAlpha:0,duration:0.4},'+=2.5');
  </script>
</body>
</html>
