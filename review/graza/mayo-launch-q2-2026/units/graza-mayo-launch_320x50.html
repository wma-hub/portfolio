<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graza — Mayo Launch — 320×50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:320px;height:50px;overflow:hidden;}

.ad{
  position:relative;width:320px;height:50px;
  background:#BFE512;
  overflow:hidden;cursor:pointer;
}

/* ── Decorative ellipses (tonal — darker green radial, not white) ── */
.ellipse{
  position:absolute;
  border-radius:50%;
}
.ellipse-tl{
  left:-30px;top:-40px;
  width:76px;height:76px;
  background:radial-gradient(circle, rgba(0,0,0,0.12) 0%, transparent 70%);
}
.ellipse-bl{
  left:49px;top:30px;
  width:76px;height:76px;
  background:radial-gradient(circle, rgba(0,0,0,0.10) 0%, transparent 70%);
}

/* ── Cream panel ── */
.cream-panel{
  position:absolute;
  left:72px;top:0;
  width:248px;height:50px;
  background:#F2E9D8;
}

/* ── Small mayo jar thumbnail ── */
.jar-thumb{
  position:absolute;
  left:8px;top:-3px;
  width:56px;height:56px;
}
.jar-thumb img{width:56px;height:56px;object-fit:contain;display:block;}

/* ── Frame 1: Headline ── */
.f1-text{
  position:absolute;
  left:196px;top:25px;
  transform:translate(-50%,-50%);
  font-family:'DM Serif Display',serif;
  font-size:18px;color:#000;
  white-space:nowrap;
  line-height:1;
}

/* ── Frame 2: Supporting copy ── */
.f2-text{
  position:absolute;
  left:90px;top:9px;
  width:222px;height:32px;
}
.f2-text .line1,
.f2-text .line2{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:#000;
  line-height:16px;display:block;text-align:left;
}

/* ── Frame 3: Wordmark + CTA ── */
.f3-wordmark{
  position:absolute;
  left:90px;top:19px;
  width:44px;height:12px;
}
.f3-wordmark img{width:44px;height:12px;object-fit:contain;display:block;}

.f3-cta{
  position:absolute;
  left:220px;top:16px;
  width:84px;height:18px;
  background:#3C422E;
  display:flex;align-items:center;justify-content:center;
  padding:4px 8px;
}
.f3-cta span{
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;color:#fff;white-space:nowrap;
}
</style>
</head>
<body>
<div class="ad" onclick="window.open('%%CLICK_URL_UNESC%%')">

  <!-- Persistent base layer -->
  <div class="ellipse ellipse-tl" id="etl"></div>
  <div class="ellipse ellipse-bl" id="ebl"></div>
  <div class="cream-panel" id="cream"></div>
  <div class="jar-thumb" id="jar">
    <img src="/review/graza/assets/img-graza.webp" alt="Graza Mayo">
  </div>

  <!-- Frame 1 -->
  <span class="f1-text" id="f1">Mayo, but make it olive oil.</span>

  <!-- Frame 2 -->
  <div class="f2-text" id="f2">
    <span class="line1">Made with 100% oil from olives.</span>
    <span class="line2">Richer and creamier.</span>
  </div>

  <!-- Frame 3 -->
  <div class="f3-wordmark" id="f3-wm">
    <img src="/review/graza/assets/logo-wordmark-graza.png" alt="Graza">
  </div>
  <div class="f3-cta" id="f3-cta">
    <span>Try Graza Mayo</span>
  </div>

</div>
<script>
// Initial states
gsap.set(['#etl','#ebl','#cream','#jar'], {opacity:0});
gsap.set('#f1', {opacity:0, clipPath:'inset(0 100% 0 0)'});
gsap.set('#f2', {opacity:0});
gsap.set(['#f3-wm','#f3-cta'], {opacity:0});
gsap.set('#f3-cta', {scale:0.85, transformOrigin:'center center'});

var tl = gsap.timeline();

// Base layer fades in
tl.to(['#etl','#ebl','#cream','#jar'], {opacity:1, duration:0.4, stagger:0.05, ease:'power1.out'});

// F1 clip-reveal
tl.to('#f1', {opacity:1, clipPath:'inset(0 0% 0 0)', duration:0.4, ease:'power2.out'}, '-=0.1');

// Hold F1
tl.to({}, {duration:2.5});

// F1 → F2
tl.to('#f1', {opacity:0, duration:0.2});
tl.to('#f2', {opacity:1, duration:0.35}, '<');

// Hold F2
tl.to({}, {duration:2.5});

// F2 → F3
tl.to('#f2', {opacity:0, duration:0.2});
tl.to('#f3-wm', {opacity:1, duration:0.3}, '<+=0.1');
tl.to('#f3-cta', {opacity:1, scale:1, duration:0.35, ease:'back.out(1.7)'}, '-=0.15');
// Hold F3
</script>
</body>
</html>
